services:
  - type: web
    name: maintenance-system
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
