{% extends "base.html" %}
{% block title %}{{ tr('new_title') }}{% endblock %}
{% block content %}

<div class="page-head">
  <h1>{{ tr('new_title') }}</h1>
  <div class="sub">{{ tr('new_sub') }}</div>
</div>

<div class="card form-card" style="max-width:860px;">
  <form method="post" action="/orders/create" class="form-grid" enctype="multipart/form-data">
    <div class="field">
      <label>{{ tr('f_reporter') }} <em>*</em></label>
      <input type="text" name="reporter_name" required maxlength="120" placeholder="{{ 'الاسم الكامل' if LANG == 'ar' else 'Full name' }}">
    </div>
    <div class="field">
      <label>{{ tr('f_contact') }}</label>
      <input type="tel" name="contact" dir="ltr" inputmode="tel" pattern="[0-9+\s\-]{7,15}" placeholder="05xxxxxxxx">
    </div>
    <div class="field">
      <label>{{ 'البريد الإلكتروني للتواصل' if LANG == 'ar' else 'Contact email' }}</label>
      <input type="email" name="reporter_email" dir="ltr" inputmode="email" placeholder="{{ 'example@mail.com' if LANG == 'ar' else 'example@mail.com' }}">
    </div>

    <div class="field wide">
      <label>{{ tr('f_building') }} <em>*</em></label>
      <select name="building" id="building" onchange="updateBuilding(this)">
        <option value="">{{ tr('select_placeholder') }}</option>
        {% for b in BUILDINGS %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
      </select>
    </div>

    <div class="field wide" id="facility_field" style="display:none;">
      <label>{{ tr('col_location') }} <em>*</em></label>
      <select name="unit" id="facility_select" disabled>
        <option value="">{{ tr('select_placeholder') }}</option>
        {% for f in PUBLIC_FACILITIES %}<option value="{{ f }}">{{ f }}</option>{% endfor %}
      </select>
    </div>

    <div class="field wide" id="t56_field" style="display:none;">
      <label>{{ tr('f_unit') }} <em>*</em></label>
      <select name="unit" id="t56_select" disabled>
        <option value="">{{ tr('select_placeholder') }}</option>
        {% for u in T56_UNITS %}<option value="{{ u }}">{{ u }}</option>{% endfor %}
      </select>
    </div>

    <div class="field wide" id="t1_field" style="display:none;">
      <label>{{ 'رقم الشقة (مبنى T1)' if LANG == 'ar' else 'Apartment Number (Building T1)' }} <em>*</em></label>
      <input type="text" name="unit" id="t1_input" placeholder="{{ 'مثال: 12' if LANG == 'ar' else 'e.g. 12' }}">
    </div>

    <div class="field">
      <label>{{ tr('f_maintenance_type') }} <em>*</em></label>
      <select name="section" id="maint_type" onchange="updateProblemType(this)" required>
        <option value="">{{ tr('select_placeholder') }}</option>
        {% for mt in MAINTENANCE_TYPES %}<option value="{{ mt }}">{{ mt }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>{{ tr('f_problem_type') }}</label>
      <select name="problem_type" id="problem_type">
        <option value="">{{ tr('select_placeholder') }}</option>
      </select>
    </div>
    <div class="field">
      <label>{{ tr('f_priority') }} <em>*</em></label>
      <select name="priority">
        {% for p in PRIORITIES %}<option value="{{ p }}" {% if p == 'عادية' %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>{{ tr('f_technician') }}</label>
      <input type="text" name="technician" maxlength="120" placeholder="{{ 'اسم الفني (اختياري)' if LANG == 'ar' else 'Technician name (optional)' }}">
    </div>

    <div class="field wide">
      <label>{{ tr('f_description') }} <em>*</em></label>
      <textarea name="description" rows="4" required placeholder="{{ 'اشرح المشكلة بدقة: الأعراض، مكان العطل، وأي تفاصيل تساعد الفني...' if LANG == 'ar' else 'Describe the problem precisely...' }}"></textarea>
    </div>

    <div class="field wide">
      <label>{{ tr('f_media') }}</label>
      <input type="file" name="media_files" accept=".jpg,.jpeg,.png,.gif,.webp,.mp4,.mov,.webm" multiple>
      <div class="dyn-hint">{{ tr('f_media_hint') }}</div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary btn-lg" type="submit">{{ tr('btn_save') }}</button>
      <a class="btn btn-ghost btn-lg" href="/">{{ tr('btn_cancel') }}</a>
    </div>
  </form>
</div>

{% endblock %}

{% block scripts %}
<script>
  const PROBLEM_TYPES = {{ PROBLEM_TYPES|tojson }};
  const unitControls = ['facility_select','t56_select','t1_input'];
  function updateProblemType(sel) {
    const val = sel.value;
    const pt = document.getElementById('problem_type');
    pt.innerHTML = '<option value="">{{ tr('select_placeholder') }}</option>';
    (PROBLEM_TYPES[val] || []).forEach(function (p) {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p; pt.appendChild(opt);
    });
  }
  function updateBuilding(sel) {
    const val = sel.value;
    ['facility_field','t56_field','t1_field'].forEach(function(id){ document.getElementById(id).style.display='none'; });
    unitControls.forEach(function(id){ document.getElementById(id).disabled=true; });
    if (val === 'المرافق العامة'){ document.getElementById('facility_field').style.display=''; document.getElementById('facility_select').disabled=false; }
    else if (val === 'مبنى T5' || val === 'مبنى T6'){ document.getElementById('t56_field').style.display=''; document.getElementById('t56_select').disabled=false; }
    else if (val === 'مبنى T1'){ document.getElementById('t1_field').style.display=''; document.getElementById('t1_input').disabled=false; }
  }
</script>
{% endblock %}
